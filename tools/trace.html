<!doctype html><meta charset="utf-8"><title>trace a sketch</title>
<canvas id="c"></canvas>
<script>
// traceMap(url): read Adam's marker drawing and hand back what he drew, 1:1 —
// every line as a polyline of its own centreline pixels, every blob as a
// polygon. Colours: BLUE lines = roads, GREEN band = the Crest, BLACK lines in
// the ORANGE = canyon roads, BLACK hatching = lakes, BLACK stripes = sea,

    if (h >= 62 && h < 178 && s > 0.2 && v > 0.1 && v < 0.85) { M.green[i] = 1; continue; }

    else if (h >= 14 && h < 42 && s > 0.4 && v > 0.45) M.orange[i] = 1;

  // under the red highlighter, marker reads as dark: near the green band it's the Crest, elsewhere it's a road
